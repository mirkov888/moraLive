name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    env:
      MORA_KEYSTORE_BASE64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
      MORA_KEYSTORE_PASSWORD: ${{ secrets.MORA_KEYSTORE_PASSWORD }}
      MORA_KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
      MORA_KEY_PASSWORD: ${{ secrets.MORA_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mora-live-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare release signing key
        if: ${{ env.MORA_KEYSTORE_BASE64 != '' && env.MORA_KEYSTORE_PASSWORD != '' && env.MORA_KEY_ALIAS != '' && env.MORA_KEY_PASSWORD != '' }}
        env:
          MORA_KEYSTORE_BASE64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
          MORA_KEYSTORE_PASSWORD: ${{ secrets.MORA_KEYSTORE_PASSWORD }}
          MORA_KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
          MORA_KEY_PASSWORD: ${{ secrets.MORA_KEY_PASSWORD }}
        run: |
          echo "$MORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mora-release.jks"
          echo "MORA_KEYSTORE_FILE=$RUNNER_TEMP/mora-release.jks" >> "$GITHUB_ENV"
          echo "MORA_KEYSTORE_PASSWORD=$MORA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MORA_KEY_ALIAS=$MORA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MORA_KEY_PASSWORD=$MORA_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ secrets.MORA_KEYSTORE_BASE64 != '' && secrets.MORA_KEYSTORE_PASSWORD != '' && secrets.MORA_KEY_ALIAS != '' && secrets.MORA_KEY_PASSWORD != '' }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: ${{ secrets.MORA_KEYSTORE_BASE64 != '' && secrets.MORA_KEYSTORE_PASSWORD != '' && secrets.MORA_KEY_ALIAS != '' && secrets.MORA_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mora-live-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error